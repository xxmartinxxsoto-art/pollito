<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tú juego <3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="btnJugar">Jugar</button> 

  <div class="juego">
    <div class="fondo"></div>
    <img src="img/snoopy-unscreen.gif" class="snoopy" id="snoopy" />
    <div class="piso"></div>
    <div class="puntos" id="puntos">0</div>
  </div>

  <audio id="musicaFondo" loop>
    <source src="audio/loffiloop.mp3" type="audio/mpeg" />
    Tu navegador no soporta audio.
  </audio>

  <!-- AUDIO DE SALTO -->
  <audio id="audioSalto" src="audio/pixel-jump-319167.mp3" preload="auto"></audio>

  <!-- AUDIO DE CHOQUE PIEDRA -->
  <audio id="audioPiedra" src="audio/bonk.mp3" preload="auto"></audio>

  <!-- BOTÓN PARA CONTROLAR LA MÚSICA -->
  <button id="btnMusica" class="boton-musica">🎵 Música</button>

  <script src="script.js"></script>
</body>
</html>
